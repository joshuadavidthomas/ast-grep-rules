id: no-code-barricade-rust
language: Rust
severity: warning
message: "Replace this decorative divider with a plain section comment."
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  regex: '(?s).*(?:={5,}|-{5,}|─{5,}|\*{5,}|/{8,}).*'
