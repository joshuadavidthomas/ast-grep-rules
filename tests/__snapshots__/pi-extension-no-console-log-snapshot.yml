    export default async function (pi: ExtensionAPI): Promise<void> {
      pi.on("model_select", async (event, ctx) => {
        ctx.ui.notify(`Using ${event.model.id}`, "info");
        console.log(`Using ${event.model.id}`);
      });
    }
