id: rust-require-thiserror-error-enum
language: Rust
severity: warning
message: "Derive thiserror::Error for error enums instead of hand-rolling error behavior."
note: "Error enums should have structured variants and a standard Error impl generated by thiserror."
rule:
  all:
    - kind: enum_item
    - has:
        field: name
        kind: type_identifier
        regex: "(^Error$|Error$)"
        stopBy: end
    - not:
        follows:
          regex: "derive\\([^\\]]*\\b(thiserror::)?Error\\b"
          stopBy: neighbor
