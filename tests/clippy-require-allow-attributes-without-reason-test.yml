id: clippy-require-allow-attributes-without-reason
valid:
  - |
    [workspace.lints.clippy]
    allow_attributes_without_reason = "warn"
  - |
    [lints.clippy]
    allow_attributes_without_reason = { level = "deny", priority = 1 }
  - |
    [lints.clippy]
    "allow_attributes_without_reason" = "forbid"
  - |
    [package]
    name = "app"

    [lints]
    workspace = true

    [lints.rust]
    unsafe_code = "forbid"
invalid:
  - |
    [workspace.lints.clippy]
    todo = "warn"
  - |
    [lints.clippy]
    allow_attributes_without_reason = "allow"
  - |
    [workspace.lints.clippy]
    allow_attributes_without_reason = { level = "allow", priority = 1 }
