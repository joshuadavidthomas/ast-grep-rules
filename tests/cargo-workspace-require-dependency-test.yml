id: cargo-workspace-require-dependency
valid:
  - |
    [package]
    name = "djls-wasm"
    version = "0.1.0"
    edition.workspace = true

    [dependencies]
    djls-source = { workspace = true }
    serde.workspace = true
    salsa = { workspace = true, features = ["salsa_unstable"] }
    tracing = { workspace = true, optional = true, default-features = false }
    wasm-bindgen.workspace = true
    wasm-bindgen.features = ["serde-serialize"]

    [dev-dependencies]
    insta = { workspace = true, features = ["yaml"] }

    [build-dependencies]
    cc.workspace = true
  - |
    [dependencies.serde]
    workspace = true
    features = ["derive"]

    [dev-dependencies.insta]
    workspace = true
  - |
    [target.'cfg(target_arch = "wasm32")'.dependencies]
    wasm-bindgen = { workspace = true }

    [target."cfg(unix)".dev-dependencies]
    nix.workspace = true

    [target.x86_64-pc-windows-msvc.build-dependencies.winres]
    workspace = true
  - |
    [workspace]
    members = ["crates/*"]

    [workspace.package]
    edition = "2024"

    [workspace.dependencies]
    wasm-bindgen = "0.2"
    serde = { version = "1", features = ["derive"] }
    djls-source = { path = "crates/djls-source" }

    [package]
    name = "djls"
    edition.workspace = true

    [dependencies]
    clap = "4"
  - |
    [workspace.dependencies]
    wasm-bindgen = "0.2"

    [dependencies]
    serde = { version = "1" }
  - |
    [package]
    name = "djls-wasm"
    description = "WebAssembly bindings"

    [features]
    default = ["std"]

    [lints]
    workspace = true
invalid:
  - |
    [dependencies]
    wasm-bindgen = "0.2"
  - |
    [dependencies]
    serde = { version = "1", features = ["derive"] }
  - |
    [dev-dependencies]
    djls-test = { path = "../djls-test" }
  - |
    [build-dependencies]
    cc = { git = "https://github.com/rust-lang/cc-rs" }
  - |
    [dependencies]
    serde.version = "1"
  - |
    [dependencies.serde]
    version = "1"
    features = ["derive"]
  - |
    [dev-dependencies.djls-test]
    path = "../djls-test"
  - |
    [target.'cfg(target_arch = "wasm32")'.dependencies]
    wasm-bindgen = "0.2"
  - |
    [target."cfg(unix)".dev-dependencies]
    nix = { version = "0.29" }
  - |
    [target.'cfg(windows)'.build-dependencies.winres]
    version = "0.1"
