id: typescript-no-record-string-unknown
valid:
  - |
    interface UserPayload {
      id: string;
      name: string;
    }

    function handle(payload: UserPayload) {
      console.log(payload.name);
    }
  - |
    const counts: Record<string, number> = {};
  - |
    function parse(input: unknown): User {
      return UserSchema.parse(input);
    }
  - |
    type Handlers = Record<EventName, Handler>;
  - |
    type Allowed = Record<string, { payload: unknown }>;
  - |
    type AlsoAllowed = Record<string, Result<Data, unknown>>;
  - |
    type Indexed = { [key: string]: Command };
  - |
    type Exhaustive = { [K in Permission]: number };
invalid:
  - |
    function handle(payload: Record<string, unknown>) {
      console.log(payload.name);
    }
  - |
    const data: Record<string, unknown> = {};
  - |
    type Props = Record<string, unknown>;
  - |
    function load(): Record<string, unknown> {
      return JSON.parse(raw);
    }
  - |
    const items: Array<Record<string, unknown>> = [];
  - |
    function merge<T extends Record<string, unknown>>(a: T, b: T): T {
      return { ...a, ...b };
    }
  - |
    interface Envelope {
      meta: Record<string, unknown>;
    }
  - |
    type Loose = Record<string, any>;
  - |
    type Bag = Record<string, object>;
  - |
    type Empty = Record<string, {}>;
  - |
    type Mixed = Record<string, string | unknown>;
  - |
    type Wrapped = Record<string, NonNullable<unknown>>;
  - |
    type Nested = Readonly<Record<string, unknown>>;
  - |
    type IndexedUnknown = { [key: string]: unknown };
  - |
    type MappedObject = { [K in PropertyKey]: object };
  - |
    interface Dictionary {
      [key: string]: unknown;
    }
