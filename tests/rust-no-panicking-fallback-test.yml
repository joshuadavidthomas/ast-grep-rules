id: rust-no-panicking-fallback
valid:
  - |
    fn render(state: State) -> Value {
        state.lookup(&["forloop".into()]).unwrap_or_else(|| json!({}))
    }
  - |
    fn render(value: Option<Value>) -> Value {
        value.unwrap_or_else(move || {
            log_missing_value();
            json!({})
        })
    }
  - |
    fn render(value: Result<Value, Error>) -> Value {
        value.map_or_else(|error| { json!({"error": error}) }, |value| value)
    }
  - |
    fn render(value: Option<()>) {
        value.unwrap_or_else(|| { log_missing_value!(); })
    }
  - |
    fn render(value: Option<Value>) -> Value {
        value.unwrap_or_else(|| {
            if strict_mode() { panic!("missing value"); }
            json!({})
        })
    }
  - |
    fn load(result: Result<Config, Error>) -> Config {
        result.unwrap_or_else(|error| recover(error))
    }
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(Config::default)
    }
  - |
    fn load(option: Option<u32>) -> u32 {
        option.unwrap_or_else(|| {
            if strict_mode() {
                panic!("strict mode requires a value");
            }
            0
        })
    }
  - |
    fn fail_at_process_boundary(error: Error) -> ! {
        panic!("startup failed: {error}")
    }
  - |
    fn describe(result: Result<Value, Error>) -> String {
        result.map_or_else(|error| error.to_string(), |value| value.to_string())
    }
  - |
    #[test]
    fn load_panics_in_test(result: Result<Config, Error>) -> Config {
        result.unwrap_or_else(|error| panic!("failed to load config: {error}"))
    }
  - |
    #[cfg(test)]
    mod tests {
        fn helper(result: Result<Config, Error>) -> Config {
            result.unwrap_or_else(|error| panic!("failed to load config: {error}"))
        }
    }
invalid:
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(|| unreachable!("missing config"))
    }
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(|| { todo!("load config") })
    }
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(move || {
            log_missing_config();
            unimplemented!("load config")
        })
    }
  - |
    fn load(result: Result<(), Error>) {
        result.unwrap_or_else(move |error| {
            log_error(error);
            panic!("missing config");
        })
    }
  - |
    fn load(option: Option<()>) {
        option.unwrap_or_else(|| {
            log_missing_config();
            todo!("load config");
        })
    }
  - |
    fn load(option: Option<()>) {
        option.unwrap_or_else(move || { unimplemented!("load config"); })
    }
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(move || { panic!("missing config") })
    }
  - |
    fn load(result: Result<Config, Error>) -> Config {
        result.unwrap_or_else(|error| panic!("failed to load config: {error}"))
    }
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(|| {
            log_missing_config();
            panic!("missing config")
        })
    }
  - |
    fn load(option: Option<Config>) -> Config {
        option.unwrap_or_else(move || unimplemented!("load config"))
    }
  - |
    fn load(option: Option<()>) {
        option.unwrap_or_else(|| {
            unreachable!("config must be present");
        })
    }
  - |
    fn load(result: Result<Config, Error>) -> Config {
        result.map_or_else(|error| todo!("handle {error}"), |config| config)
    }
  - |
    fn load(result: Result<Config, Error>) -> Config {
        Result::unwrap_or_else(result, |error| panic!("failed to load config: {error}"))
    }
  - |
    fn load(option: Option<Config>) -> Config {
        Option::map_or_else(
            option,
            || panic!("missing config"),
            |config| config,
        )
    }
  - |
    #[cfg(test)]
    mod tests {}

    fn load(result: Result<Config, Error>) -> Config {
        result.unwrap_or_else(|error| panic!("failed to load config: {error}"))
    }
