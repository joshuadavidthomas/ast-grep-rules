id: swift-no-eager-stack-in-scroll-view
language: Swift
severity: warning
message: "Use LazyVStack or LazyHStack for ForEach content in a ScrollView; an eager stack builds every row up front."
note: "VStack and HStack create all of their children immediately, even rows far off screen. A lazy stack, or List, creates rows as they scroll into view. Keep the eager stack only for a small fixed collection, and suppress with an inline ast-grep-ignore comment that says why."
rule:
  kind: simple_identifier
  regex: "^(VStack|HStack)$"
  inside:
    kind: call_expression
    all:
      - has:
          kind: call_suffix
          has:
            kind: lambda_literal
            has:
              kind: call_expression
              has:
                kind: simple_identifier
                regex: "^ForEach$"
              stopBy:
                kind: lambda_literal
      - inside:
          kind: lambda_literal
          stopBy:
            kind: lambda_literal
          inside:
            kind: call_suffix
            inside:
              kind: call_expression
              has:
                kind: simple_identifier
                regex: "^ScrollView$"
