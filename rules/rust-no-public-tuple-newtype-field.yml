id: rust-no-public-tuple-newtype-field
language: Rust
severity: error
message: "Do not make a tuple newtype's field visible; keep the field private and expose intentional constructors or accessors."
note: "A visible field lets callers bypass invariants, making the wrapper little more than a type alias."
rule:
  any:
    - pattern: pub struct $NAME(pub $TYPE);
    - pattern: pub(crate) struct $NAME(pub $TYPE);
    - pattern: pub(super) struct $NAME(pub $TYPE);
