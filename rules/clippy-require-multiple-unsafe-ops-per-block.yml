id: clippy-require-multiple-unsafe-ops-per-block
language: toml
severity: error
message: "Set `multiple_unsafe_ops_per_block = \"warn\"` in this Clippy lints table."
note: "Applies to `[lints.clippy]` in a package manifest and `[workspace.lints.clippy]` in a workspace root. `deny` and `forbid` also satisfy the rule. To leave the lint off on purpose, add a `# ast-grep-ignore: clippy-require-multiple-unsafe-ops-per-block` comment above the table that says why, or pass `--off=clippy-require-multiple-unsafe-ops-per-block`."
files:
  - "**/Cargo.toml"
rule:
  matches: clippy-lints-header
  inside:
    kind: table
    not:
      has:
        matches: clippy-lint-enabled
        has:
          any:
            - kind: bare_key
            - kind: quoted_key
          regex: "^[\"']?multiple_unsafe_ops_per_block[\"']?$"
