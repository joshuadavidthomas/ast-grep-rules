id: rust-no-string-error-variant
language: Rust
severity: warning
message: "Do not store bare String payloads in error variants; use structured fields or source errors."
note: "Stringly error variants make recovery, testing, and formatting policy harder than typed error data."
rule:
  all:
    - kind: enum_item
    - has:
        field: name
        kind: type_identifier
        regex: "(^Error$|Error$)"
        stopBy: end
    - has:
        kind: enum_variant
        has:
          kind: ordered_field_declaration_list
          has:
            kind: type_identifier
            regex: "^String$"
            stopBy: end
          stopBy: end
        stopBy: end
