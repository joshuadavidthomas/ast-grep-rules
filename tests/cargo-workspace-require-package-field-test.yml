id: cargo-workspace-require-package-field
valid:
  - |
    [package]
    name = "djls-wasm"
    version = "0.1.0"
    edition.workspace = true
    rust-version.workspace = true
    license.workspace = true
    repository.workspace = true
  - |
    [package]
    name = "djls-wasm"
    edition = { workspace = true }
  - |
    [package]
    name = "djls"
    version = "6.0.0"
    description = "Django language server"
  - |
    [workspace]
    members = ["crates/*"]

    [workspace.package]
    edition = "2024"
    rust-version = "1.90"
    license = "Apache-2.0"
    repository = "https://github.com/joshuadavidthomas/django-language-server"

    [package]
    name = "djls"
    edition = "2024"
  - |
    [dependencies]
    edition = "0.1"
invalid:
  - |
    [package]
    name = "djls-wasm"
    edition = "2024"
  - |
    [package]
    name = "djls-wasm"
    rust-version = "1.90"
  - |
    [package]
    name = "djls-wasm"
    license = "Apache-2.0"
  - |
    [package]
    name = "djls-wasm"
    repository = "https://github.com/joshuadavidthomas/django-language-server"
  - |
    [package]
    name = "djls-wasm"
    edition = { workspace = false }
