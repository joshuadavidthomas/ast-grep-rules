id: swift-no-any-view
language: Swift
severity: error
message: "Do not use AnyView; return `some View` from a @ViewBuilder, use Group, or make the container generic over its content."
note: "AnyView hides the view's type, so SwiftUI cannot diff the subtree structurally and rebuilds it more often. AnyShapeStyle is not affected. Keep AnyView only where the type must be erased, such as a heterogeneous collection of views, and suppress with an inline ast-grep-ignore comment that says why."
rule:
  kind: call_expression
  has:
    kind: simple_identifier
    regex: "^AnyView$"
