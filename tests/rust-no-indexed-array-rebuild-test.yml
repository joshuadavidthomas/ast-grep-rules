id: rust-no-indexed-array-rebuild
valid:
  - |
    fn le32(bytes: &[u8]) -> Result<u32, ProtocolError> {
        let (head, _rest) = bytes
            .split_first_chunk::<4>()
            .ok_or(ProtocolError::Truncated { needed: 4, actual: bytes.len() })?;
        Ok(u32::from_le_bytes(*head))
    }
  - |
    fn le32(bytes: &[u8]) -> Result<u32, ProtocolError> {
        let head: [u8; 4] = bytes[..4].try_into().map_err(ProtocolError::Truncated)?;
        Ok(u32::from_le_bytes(head))
    }
  - |
    fn le32(bytes: &[u8; 4]) -> u32 {
        u32::from_le_bytes(*bytes)
    }
  - |
    fn pair(a: usize, b: usize) -> [usize; 2] {
        [a, b]
    }
  - |
    fn window(values: &[u8], at: usize) -> [u8; 2] {
        [values[at], values[at + 1]]
    }
  - |
    fn first_row(rows: &[Row]) -> [Row; 1] {
        [rows[0].clone()]
    }
  - |
    fn padded(values: &[u8]) -> [u8; 2] {
        [values[0], 0]
    }
  - |
    fn heads(left: &[u8], right: &[u8]) -> [u8; 2] {
        [left[0], right[0]]
    }
invalid:
  - |
    fn le16(bytes: &[u8]) -> u16 {
        u16::from_le_bytes([bytes[0], bytes[1]])
    }
  - |
    fn le32(bytes: &[u8]) -> u32 {
        u32::from_le_bytes([bytes[0], bytes[1], bytes[2], bytes[3]])
    }
  - |
    fn le64(bytes: &[u8]) -> u64 {
        u64::from_le_bytes([
            bytes[0], bytes[1], bytes[2], bytes[3], bytes[4], bytes[5], bytes[6], bytes[7],
        ])
    }
  - |
    fn second_word(bytes: &[u8]) -> u32 {
        u32::from_le_bytes([bytes[4], bytes[5], bytes[6], bytes[7]])
    }
  - |
    fn header(frame: &Frame) -> [u8; 2] {
        [frame.bytes[0], frame.bytes[1]]
    }
  - |
    fn copy(values: &[u8]) -> [u8; 3] {
        let out = [values[0], values[1], values[2]];
        out
    }
