id: swift-no-print-changes
valid:
  - |
    var body: some View {
        Text(title)
    }
  - |
    printChanges()
invalid:
  - |
    var body: some View {
        let _ = Self._printChanges()
        Text(title)
    }
  - |
    var body: some View {
        let _ = Self._logChanges()
        Text(title)
    }
