id: rust-no-deref-polymorphism
valid:
  - |
    impl User {
        pub fn inner(&self) -> &Inner {
            &self.inner
        }
    }
  - |
    impl AsRef<Inner> for User {
        fn as_ref(&self) -> &Inner {
            &self.inner
        }
    }
invalid:
  - |
    impl Deref for User {
        type Target = Inner;

        fn deref(&self) -> &Self::Target {
            &self.inner
        }
    }
  - |
    impl std::ops::Deref for User {
        type Target = Inner;

        fn deref(&self) -> &Self::Target {
            &self.inner
        }
    }
