id: rust-no-panicking-match-arm
valid:
  - |
    fn status(result: Result<u32, Error>) -> u32 {
        match result {
            Ok(value) => value,
            Err(_) => 0,
        }
    }
  - |
    fn load(result: Result<Config, Error>) -> Result<Config, Error> {
        match result {
            Ok(config) => Ok(config),
            Err(error) => return Err(error),
        }
    }
  - |
    fn values(option: Option<u32>) -> Vec<u32> {
        match option {
            Some(x) => vec![x],
            None => format!("none").into_bytes(),
        }
    }
  - |
    fn load(result: Result<u32, Error>, strict: bool) -> u32 {
        match result {
            Ok(value) => value,
            Err(_) => {
                if strict {
                    panic!("strict");
                }
                0
            }
        }
    }
  - |
    fn lock<'a, T>(mutex: &'a Mutex<T>) -> MutexGuard<'a, T> {
        mutex.lock().unwrap_or_else(PoisonError::into_inner)
    }
  - |
