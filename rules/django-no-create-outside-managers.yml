id: django-no-create-outside-managers
language: python
severity: error
message: "Do not create rows through objects.create() outside managers; add or reuse a create_<model>() Manager method and call it."
note: >-
  Reports `.create()`, `.bulk_create()`, `.get_or_create()`, and `.update_or_create()` on
  `objects`, `_default_manager`, or `_base_manager`. Put the creation and everything that goes
  with it (defaults, related rows, audit entries, signals you would otherwise forget) on the Manager,
  as in `Invoice.objects.create_invoice(client, lines)` or `Batch.objects.create_for_user(user)`.
  Models, managers, querysets, migration, and test modules are skipped.
ignores:
  - "**/models.py"
  - "**/models/**"
  - "**/managers.py"
  - "**/managers/**"
  - "**/querysets.py"
  - "**/querysets/**"
  - "**/migrations/**"
  - "**/tests/**"
  - "**/tests.py"
  - "**/test_*.py"
  - "**/*_tests.py"
  - "**/conftest.py"
rule:
  kind: call
  has:
    field: function
    kind: attribute
    all:
      - has:
          field: attribute
          regex: "^(create|bulk_create|get_or_create|update_or_create)$"
      - has:
          field: object
          kind: attribute
          has:
            field: attribute
            regex: "^(objects|_default_manager|_base_manager)$"
